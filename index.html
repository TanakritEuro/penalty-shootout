<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Penalty Shootout</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud">
      <div id="scoreboard"></div>
      <div id="corner">
        <button id="menu-btn" type="button" aria-label="Menu">☰</button>
        <div id="level"></div>
      </div>
      <div id="status"></div>
      <div id="result" hidden>
        <div id="result-title"></div>
        <div id="result-detail"></div>
      </div>
      <div id="hint" hidden></div>
      <div id="replay-tag" hidden>▶ REPLAY</div>
      <button id="replay-btn" type="button" hidden><span id="replay-label">▶ Replay</span> <span class="keys-only">(Space)</span></button>
      <div id="contact" class="hidden">
        <div id="contact-ball"><div id="contact-dot"></div></div>
        <div id="contact-label">SPIN · <span class="keys-only">WASD</span><span class="touch-only">TAP</span></div>
      </div>
      <div id="power">
        <div id="power-track">
          <div id="power-sweet"></div>
          <div id="power-danger"></div>
          <div id="power-fill"></div>
        </div>
        <div id="power-label">POWER</div>
      </div>
    </div>
    <div id="rotate-hint">Turn your phone sideways for the best view</div>
    <div id="menu" hidden></div>
    <div id="loading"><div class="spinner"></div>Loading the stadium…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
